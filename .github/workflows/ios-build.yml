# Builds the iPhone app (Capacitor wrapping src/) on a GitHub cloud Mac (free: this repository is public), signs it for the
# App Store and uploads it to TestFlight. Start it from the Actions tab or with:
#   npm run testflight   (in the CreativeFlow project; it updates this repository first)
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   IOS_CERT_P12_BASE64  Apple Distribution certificate + key (.p12), base64
#   IOS_CERT_PASSWORD    password of that .p12
#   IOS_PROFILE_BASE64   App Store provisioning profile (.mobileprovision), base64
#   APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER   App Store Connect API key (uploads)
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.creativeminds.creativeflow
      TEAM_ID: U4AML6MF2Q
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use the newest Xcode on the runner
        run: |
          xc=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - run: npm ci

      - name: Make the iPhone project
        run: |
          node scripts/prepare-ios-www.js
          npx cap add ios
          npx cap sync ios

      - name: App icon, launch screen, version and settings
        run: |
          set -e
          APP=ios/App/App
          # Icon: 1024x1024 with no transparency (the App Store refuses alpha channels).
          sips -z 1024 1024 build/icon.png --out /tmp/icon.png >/dev/null
          sips -s format jpeg /tmp/icon.png --out /tmp/icon.jpg >/dev/null
          sips -s format png /tmp/icon.jpg --out "$APP/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" >/dev/null
          # Launch screen: the app's dark background with the logo in the middle (replaces Capacitor's).
          sips -z 600 600 /tmp/icon.jpg --out /tmp/logo.jpg >/dev/null
          sips -p 2732 2732 --padColor 0A0712 /tmp/logo.jpg --out /tmp/splash.jpg >/dev/null
          for f in "$APP"/Assets.xcassets/Splash.imageset/*.png; do sips -s format png /tmp/splash.jpg --out "$f" >/dev/null; done
          # Version from package.json, build number from this run (must go up with every upload).
          VERSION=$(node -p "require('./package.json').version")
          # iPhone only (no iPad version for now).
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g; s/TARGETED_DEVICE_FAMILY = 2;/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'TARGETED_DEVICE_FAMILY' ios/App/App.xcodeproj/project.pbxproj && grep 'TARGETED_DEVICE_FAMILY' ios/App/App.xcodeproj/project.pbxproj | sort -u
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $((${{ github.run_number }} + 100));/g" ios/App/App.xcodeproj/project.pbxproj
          PL="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CreativeFlow" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string CreativeFlow" "$PL"
          # Why the app asks for Reminders (Add to Reminders). Calendar text too: the same plugin includes calendar code.
          for k in NSRemindersUsageDescription NSRemindersFullAccessUsageDescription; do
            /usr/libexec/PlistBuddy -c "Add :$k string CreativeFlow adds your scheduled videos to Reminders so you don't miss an upload." "$PL" 2>/dev/null || true
          done
          for k in NSCalendarsUsageDescription NSCalendarsFullAccessUsageDescription NSCalendarsWriteOnlyAccessUsageDescription; do
            /usr/libexec/PlistBuddy -c "Add :$k string CreativeFlow can add your scheduled uploads to your calendar." "$PL" 2>/dev/null || true
          done
          # The app's own link (com.creativeminds.creativeflow://), which Google/Apple sign-in returns to.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $BUNDLE_ID" "$PL"
          echo "Version $VERSION ($((${{ github.run_number }} + 100)))"

      - name: Install the signing certificate and profile
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Use manual signing for the app target
        run: |
          fastlane run update_code_signing_settings \
            path:ios/App/App.xcodeproj targets:App use_automatic_signing:false \
            team_id:"$TEAM_ID" code_sign_identity:"Apple Distribution" \
            profile_name:"$PROFILE_NAME" profile_uuid:"$PROFILE_UUID" bundle_identifier:"$BUNDLE_ID"

      - name: Build and export the .ipa
        run: |
          set -e
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tail -20
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - uses: actions/upload-artifact@v5
        with:
          name: ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
